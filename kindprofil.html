<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kindprofil – KidsTracker</title>
  <meta name="description" content="Kindprofil von KidsTracker by TRILUVI.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .kindprofil-page {
      background: var(--cream);
    }

    .kindprofil-main {
      padding: 72px 0 100px;
    }

    .kindprofil-intro {
      max-width: 760px;
      margin: 0 auto 42px;
      text-align: center;
    }

    .kindprofil-intro h1 {
      font-size: clamp(2.4rem, 5vw, 4.4rem);
      margin-bottom: 14px;
      overflow-wrap: anywhere;
    }

    .kindprofil-intro p {
      margin: 0;
      color: var(--soft);
    }

    .profile-status {
      max-width: 620px;
      margin: 0 auto;
      text-align: center;
      padding: 56px 28px;
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 28px;
      color: var(--soft);
    }

    .profile-status strong {
      display: block;
      margin-bottom: 8px;
      color: var(--p);
      font-family: Sora, Arial, sans-serif;
      font-size: 1.15rem;
    }

    .kid-block {
      max-width: 820px;
      margin: 0 auto 56px;
    }

    .kid-block:last-child {
      margin-bottom: 0;
    }

    .kid-heading {
      margin-bottom: 18px;
    }

    .kid-heading h1 {
      margin: 0 0 6px;
      font-size: clamp(2.2rem, 5vw, 3.4rem);
      overflow-wrap: anywhere;
    }

    .birthdate {
      margin: 0;
      color: var(--soft);
      font-size: .95rem;
    }

    .profile-section {
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 26px 28px;
      margin-top: 16px;
    }

    .profile-section h2 {
      margin: 0 0 16px;
      font-size: 1.45rem;
      line-height: 1.2;
    }

    .size-row {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      padding: 12px 0;
      border-bottom: 1px solid var(--line);
      font-size: .95rem;
    }

    .size-row:last-child {
      border-bottom: none;
    }

    .size-value,
    .item-meta,
    .empty {
      color: var(--soft);
    }

    .item {
      padding: 14px 0;
      border-bottom: 1px solid var(--line);
    }

    .item:last-child {
      border-bottom: none;
    }

    .item-name {
      font-weight: 700;
      font-size: 1rem;
      line-height: 1.45;
    }

    .item-meta {
      margin-top: 4px;
      font-size: .86rem;
      line-height: 1.5;
    }

    .priority-hoch {
      color: var(--pink);
      font-weight: 700;
    }

    .priority-mittel {
      color: var(--p);
      font-weight: 600;
    }

    .priority-niedrig {
      color: var(--soft);
    }

    .item-link {
      display: inline-block;
      margin-top: 9px;
      color: var(--p);
      font-weight: 700;
      text-decoration: underline;
      text-decoration-color: var(--pink);
      text-underline-offset: 3px;
    }

    .empty {
      margin: 0;
      font-style: italic;
    }

    .loading,
    .error {
      max-width: 620px;
      margin: 40px auto 0;
      text-align: center;
      padding: 56px 28px;
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 28px;
      color: var(--soft);
    }

    @media (max-width: 560px) {
      .kindprofil-main {
        padding: 42px 0 70px;
      }

      .kindprofil-intro {
        margin-bottom: 30px;
      }

      .profile-section {
        padding: 22px 20px;
        border-radius: 20px;
      }

      .kid-block {
        margin-bottom: 42px;
      }
    }
  </style>
</head>
<body class="kindprofil-page">

<header class="header">
  <div class="container nav">
    <a class="brand" href="index.html#top">
      <img src="assets/triluvi-logo.svg" alt="TRILUVI">
      <span>TRILUVI</span>
    </a>
    <button class="menu" aria-label="Menü" aria-expanded="false">
      <i></i><i></i><i></i>
    </button>
    <nav>
      <a href="index.html#kidstracker">KidsTracker</a>
      <a href="index.html#magazin">Magazin</a>
      <a href="index.html#about">Über TRILUVI</a>
      <a href="index.html#contact">Kontakt</a>
    </nav>
  </div>
</header>

<main class="kindprofil-main">
  <div class="container">
    <div class="kindprofil-intro">
      <p class="eyebrow">
        KIDSTRACKER BY TRILUVI
      </p>
      <h1>
        Kinderprofil
      </h1>
    </div>

    <div class="container" id="app">
      <div class="loading">Lädt...</div>
    </div>
  </div>
</main>

<footer>
  <div class="container footer">
    <div>
      <a class="brand" href="index.html#top">
        <img src="assets/triluvi-logo.svg" alt="">
        <span>TRILUVI</span>
      </a>
      <p>Family life, simplified.</p>
    </div>
    <div class="footer-nav">
      <a href="index.html#kidstracker">KidsTracker</a>
      <a href="index.html#magazin">Magazin</a>
      <a href="index.html#about">Über TRILUVI</a>
      <a href="index.html#contact">Kontakt</a>
    </div>
  </div>
  <div class="container bottom">
    <span>© <span id="year"></span> TRILUVI</span>
    <span><a href="impressum.html">Impressum</a>&nbsp; · &nbsp;<a href="datenschutz.html">Datenschutz</a></span>
  </div>
</footer>

<script>
const SUPABASE_URL = "https://etszrafazjtpgfpmqgro.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV0c3pyYWZhemp0cGdmcG1xZ3JvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU1ODEwMDcsImV4cCI6MjEwMTE1NzAwN30.apE4i5jJ5TR7rpniFsqBxjc7E9gJGJH7GkFbFmbzDw0";
const FUNCTION_NAME = "get-shared-kid";

function getToken() {
  const params = new URLSearchParams(window.location.search);
  return params.get("token");
}

function displayCategoryName(category) {
  const map = {
    oberteil: "Oberteil",
    hose: "Hose",
    schuhe: "Schuhe",
    jacke: "Jacke",
    schlafanzug: "Schlafanzug",
    spielzeug: "Spielzeug",
    kleidung: "Kleidung",
    buecher: "Bücher",
    sonstiges: "Sonstiges"
  };
  return map[category] || category;
}

function priorityLabel(priority) {
  if (priority === 3) return '<span class="priority-hoch">Hohe Priorität</span>';
  if (priority === 2) return '<span class="priority-mittel">Mittlere Priorität</span>';
  return '<span class="priority-niedrig">Niedrige Priorität</span>';
}

function formatBirthdate(isoString) {
  if (!isoString) return "";
  const date = new Date(isoString);
  return date.toLocaleDateString("de-DE", { day: "numeric", month: "long", year: "numeric" });
}

async function loadData() {
  const token = getToken();
  const app = document.getElementById("app");

  if (!token) {
    const params = new URLSearchParams(window.location.search);
    const isConfirmation = params.has("code");

    if (isConfirmation) {
      app.innerHTML = `
        <div class="loading">
          <strong>Startklar!</strong>
          <div>Deine E-Mail wurde bestätigt. Du kannst die App jetzt öffnen und dich anmelden.</div>
        </div>
      `;
    } else {
      app.innerHTML = '<div class="error">Kein gültiger Link.</div>';
    }
    return;
  }

  try {
    const response = await fetch(`${SUPABASE_URL}/functions/v1/${FUNCTION_NAME}`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
        "apikey": SUPABASE_ANON_KEY
      },
      body: JSON.stringify({ token })
    });

    if (!response.ok) {
      app.innerHTML = '<div class="error">Dieses Profil wurde nicht gefunden.</div>';
      return;
    }

    const data = await response.json();
    render(data);
  } catch (err) {
    app.innerHTML = '<div class="error">Etwas ist schiefgelaufen. Bitte Link prüfen.</div>';
  }
}
function favoriteColor(color) {
  const map = {
    appPink: "rgb(95%, 62%, 68%)",
    appSkyBlue: "rgb(53%, 73%, 89%)",
    appMint: "rgb(55%, 82%, 76%)",
    appYellow: "rgb(96%, 78%, 38%)",
    appLavender: "rgb(55%, 50%, 68%)",
    appCoral: "rgb(91%, 57%, 42%)",
    appGreen: "rgb(60%, 78%, 55%)",
    appPeach: "rgb(87%, 79%, 65%)"
  };

  return map[color] || map.appPeach;
}

function render(data) {
  const { kid, sizes, items } = data;
  const app = document.getElementById("app");

  const sizeCategories = ["oberteil", "hose", "schuhe", "jacke", "schlafanzug"];
  const sizesHtml = sizeCategories.map(cat => {
    const found = sizes.find(s => s.category === cat);
    return `<div class="size-row">
      <span>${displayCategoryName(cat)}</span>
      <span class="size-value">${found ? found.size : "—"}</span>
    </div>`;
  }).join("");

  const vorhanden = items.filter(i => i.status === "vorhanden");
  const gewuenscht = items.filter(i => i.status === "gewuenscht")
    .sort((a, b) => (b.priority || 0) - (a.priority || 0));

  const vorhandenHtml = vorhanden.length
    ? vorhanden.map(itemHtml).join("")
    : '<p class="empty">Noch nichts eingetragen</p>';

  const gewuenschtHtml = gewuenscht.length
    ? gewuenscht.map(item => itemHtml(item, true)).join("")
    : '<p class="empty">Noch nichts gewünscht</p>';

  app.innerHTML = `
    <div class="kid-block">
      <div class="kid-heading">
        <h1>${escapeHtml(kid.name)}</h1>
        <p class="birthdate">${formatBirthdate(kid.birthdate)}</p>
       ${kid.interests ? `
      <div style="
        width:100%;
        display:flex;
        align-items:center;
        justify-content:flex-start;
        gap:8px;
        margin-top:8px;
        padding:0;
        color:var(--soft);
        font-size:.95rem;
        line-height:1.6;
        text-align:left;
        ">
      <span
        style="
        width:8px;
        height:8px;
        border-radius:50%;
        background:${favoriteColor(kid.favorite_color)};
        display:inline-block;
        flex:0 0 auto;
        "
      ></span>
    <span>${escapeHtml(kid.interests)}</span>
  </div>
` : ""}
      </div>

      <section class="profile-section">
        <h2>Kleidergrößen</h2>
        ${sizesHtml}
      </section>

      <section class="profile-section">
        <h2>Bereits vorhanden</h2>
        ${vorhandenHtml}
      </section>

      <section class="profile-section">
        <h2>Wunschliste</h2>
        ${gewuenschtHtml}
      </section>
    </div>
  `;
}

function itemHtml(item, showPriority = false) {
  const priorityPart = showPriority && item.priority
    ? `<div class="item-meta">${priorityLabel(item.priority)}</div>`
    : "";
  const notePart = item.note
    ? `<div class="item-meta">${escapeHtml(item.note)}</div>`
    : "";
  const linkPart = item.product_link
    ? `<a class="item-link" href="${escapeHtml(item.product_link)}" target="_blank" rel="noopener">Produkt ansehen →</a>`
    : "";
  const claimedPart = showPriority && item.is_claimed
    ? `<div class="item-meta" style="color:var(--p);font-weight:700;">✓ Wird schon geschenkt${item.claimed_by ? " von " + escapeHtml(item.claimed_by) : ""}</div>`
    : "";
  const nameStyle = showPriority && item.is_claimed
    ? "text-decoration:line-through;opacity:0.6;"
    : "";

  return `<div class="item">
    <div class="item-name" style="${nameStyle}">
      ${escapeHtml(item.name)}
      <span style="font-weight:400;color:var(--soft);font-size:0.85rem;"> · ${displayCategoryName(item.category)}</span>
    </div>
    ${priorityPart}
    ${claimedPart}
    ${notePart}
    ${linkPart}
  </div>`;
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

loadData();
</script>
<script src="js/main.js"></script>
</body>
</html>
